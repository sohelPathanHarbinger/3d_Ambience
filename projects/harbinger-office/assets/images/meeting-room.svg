<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" font-family="Segoe UI, Arial, sans-serif">
  <!-- Top view of the meeting room -->
  <rect width="480" height="280" fill="#3e4450"/>
  <rect x="20" y="20" width="440" height="240" rx="10" fill="#4a5160"/>
  <!-- Screen on the left wall -->
  <rect x="26" y="95" width="10" height="90" rx="2" fill="#26282c"/>
  <rect x="36" y="100" width="4" height="80" fill="#5ec8ff"/>
  <!-- Chairs -->
  <g fill="#2a2522" stroke="#6b717c" stroke-width="2">
    <rect x="130" y="62" width="36" height="32" rx="8"/><rect x="200" y="62" width="36" height="32" rx="8"/>
    <rect x="270" y="62" width="36" height="32" rx="8"/><rect x="340" y="62" width="36" height="32" rx="8"/>
    <rect x="130" y="186" width="36" height="32" rx="8"/><rect x="200" y="186" width="36" height="32" rx="8"/>
    <rect x="270" y="186" width="36" height="32" rx="8"/><rect x="340" y="186" width="36" height="32" rx="8"/>
    <rect x="76" y="122" width="32" height="36" rx="8"/>
  </g>
  <!-- Table -->
  <rect x="112" y="92" width="286" height="96" rx="14" fill="#6b4a32"/>
  <polygon points="255,128 270,154 240,154" fill="#26282c"/>
  <!-- Labels -->
  <text x="430" y="255" font-size="14" fill="#c9d1db" text-anchor="end">Seats 9 · Video conferencing</text>
</svg>
